# CI for the churn API: run the tests, build the image, smoke-test the container, and (when enabled) push to ECR.
#
# The push job is INACTIVE until the repository variable ECR_PUSH_ENABLED is "true" (Settings -> Secrets and variables ->
# Actions -> Variables) and two repository secrets exist: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, the access key of the
# IAM user bank-churn-ci-pusher (can only push to the one ECR repository). GitHub OIDC would avoid stored keys and is the
# preferred design, but the organization blocks it; see docs/deployment.md. Without the variable only test + image run.
name: build-push

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "notebooks/**", "reports/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: bank-churn-api

jobs:
  test:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-serve.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest -q -ra   # tests that need data/ (not in git) skip themselves

  image:
    name: build image and smoke-test the container
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Image tag (short git SHA)
        id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t "bank-churn-api:${{ steps.meta.outputs.tag }}" .
      - name: Run the container with the production hardening flags
        run: |
          docker run -d --name api -p 8000:8000 \
            --memory 512m --memory-swap 512m \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e XGB_NTHREADS=2 "bank-churn-api:${{ steps.meta.outputs.tag }}"
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Smoke test the container
        run: python3 scripts/smoke_test.py --base-url http://127.0.0.1:8000
      - name: Container runs as non-root and the HEALTHCHECK reports healthy
        run: |
          test "$(docker exec api id -u)" = "10001"
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            echo "healthcheck: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs api
          exit 1
      - name: Container logs (on failure)
        if: failure()
        run: docker logs api || true
      - name: Save the image for the push job
        if: ${{ vars.ECR_PUSH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
        run: docker save "bank-churn-api:${{ steps.meta.outputs.tag }}" | gzip > image.tar.gz
      - name: Upload the image for the push job
        if: ${{ vars.ECR_PUSH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  push:
    name: push to ECR (inactive until enabled)
    needs: image
    if: ${{ vars.ECR_PUSH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Load the image that passed the smoke test
        run: docker load -i image.tar.gz
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Mask the AWS account ID in logs
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "::add-mask::${REGISTRY%%.*}"   # the registry host starts with the 12-digit account ID
      - name: Push (skipped if the immutable tag already exists)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists in ECR (tags are immutable); nothing to push"
            exit 0
          fi
          docker tag "bank-churn-api:$TAG" "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
      - name: Scan findings and compressed size
        run: |
          size="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageSizeInBytes' --output text)"
          # The scan record can appear a few seconds after the push, so `wait` fails with ScanNotFoundException if called too early.
          # Retry briefly; a scan that is still missing is a warning, not a failed push.
          findings="scan not available yet"
          for i in 1 2 3 4 5 6; do
            if aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" 2>/dev/null; then
              findings="$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" --query 'imageScanFindings.findingSeverityCounts' --output json | tr -d ' \n')"
              break
            fi
            echo "scan not ready (attempt $i of 6)"; sleep 10
          done
          [ "$findings" = "scan not available yet" ] && echo "::warning::ECR scan for $TAG was not available after retries; check the repository's scan results"
          {
            echo "### Image pushed to ECR"
            echo "- tag: \`$TAG\`"
            echo "- compressed size: $((size / 1048576)) MB"
            echo "- scan findings by severity: \`$findings\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
